<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 980" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="980" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <g transform="translate(40, 25)">
    <text x="380" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">
      တရုတ်အသံထွက် သင်္ကေတများ ㄅㄆㄇㄈ (Zhuyin / Bopomofo)
    </text>
    <text x="380" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
      ရှေးဟောင်း တရုတ်စာလုံးများမှ ဆင်းသက်လာသော အခြေခံ ဗျည်းသင်္ကေတ ၂၁ လုံး ဇယား
    </text>
  </g>

  <!-- 4-Column Grid (Row height: 120, Col width: 175, gap: 12) -->
  <g transform="translate(46, 95)">

    <!-- Row 1: ㄅ ㄆ ㄇ ㄈ -->
    <!-- ㄅ (b) -->
    <g transform="translate(0, 0)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄅ</text>
      <text x="87" y="80" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">b (bō)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">八 (၈) • 爸 (အဖေ)</text>
    </g>

    <!-- ㄆ (p) -->
    <g transform="translate(187, 0)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄆ</text>
      <text x="87" y="80" fill="#fb7185" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">p (pō) 💨</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">坡 (တောင်စောင်း) • 跑</text>
    </g>

    <!-- ㄇ (m) -->
    <g transform="translate(374, 0)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄇ</text>
      <text x="87" y="80" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">m (mō)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">妈 (အမေ) • 忙 (များ)</text>
    </g>

    <!-- ㄈ (f) -->
    <g transform="translate(561, 0)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄈ</text>
      <text x="87" y="80" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">f (fō)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">发 (ထွက်ပေါ်) • 佛</text>
    </g>

    <!-- Row 2: ㄉ ㄊ ㄋ ㄌ -->
    <!-- ㄉ (d) -->
    <g transform="translate(0, 130)">
