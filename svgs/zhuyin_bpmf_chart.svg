      <text x="87" y="80" fill="#fb7185" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">k (kē) 💨</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">看 (ကြည့်) • 口 (ပါးစပ်)</text>
    </g>

    <!-- ㄏ (h) -->
    <g transform="translate(374, 260)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄏ</text>
      <text x="87" y="80" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">h (hē)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">好 (ကောင်း) • 很 (အရမ်း)</text>
    </g>

    <!-- Placeholder block -->
    <g transform="translate(561, 260)">
      <rect width="175" height="118" rx="12" fill="#0f172a" stroke="#334155" stroke-dasharray="4 4"/>
      <text x="87" y="65" fill="#475569" font-size="12" text-anchor="middle">(舌根音 - Velars)</text>
    </g>

    <!-- Row 4: ㄐ ㄑ ㄒ -->
    <!-- ㄐ (j) -->
    <g transform="translate(0, 390)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄐ</text>
      <text x="87" y="80" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">j (jī)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">家 (အိမ်) • 见 (တွေ့)</text>
    </g>

    <!-- ㄑ (q) -->
    <g transform="translate(187, 390)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄑ</text>
      <text x="87" y="80" fill="#fb7185" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">q (qī) 💨</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">七 (၇) • 去 (သွား)</text>
    </g>

    <!-- ㄒ (x) -->
    <g transform="translate(374, 390)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄒ</text>
      <text x="87" y="80" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">x (xī)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">谢 (ကျေးဇူး) • 小</text>
    </g>

    <!-- Placeholder block -->
    <g transform="translate(561, 390)">
      <rect width="175" height="118" rx="12" fill="#0f172a" stroke="#334155" stroke-dasharray="4 4"/>
      <text x="87" y="65" fill="#475569" font-size="12" text-anchor="middle">(舌面前 - Palatals)</text>
    </g>

    <!-- Row 5: ㄓ ㄔ ㄕ ㄖ -->
    <!-- ㄓ (zh) -->
    <g transform="translate(0, 520)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄓ</text>
      <text x="87" y="80" fill="#f43f5e" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">zh (zhī)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">中 (အလယ်) • 这 (ဤ)</text>
    </g>

    <!-- ㄔ (ch) -->
    <g transform="translate(187, 520)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄔ</text>
      <text x="87" y="80" fill="#fb7185" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">ch (chī) 💨</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">吃 (စားသည်) • 车 (ကား)</text>
    </g>

    <!-- ㄕ (sh) -->
    <g transform="translate(374, 520)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄕ</text>
      <text x="87" y="80" fill="#f43f5e" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">sh (shī)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">十 (၁၀) • 是 (ဖြစ်သည်)</text>
    </g>

    <!-- ㄖ (r) -->
    <g transform="translate(561, 520)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄖ</text>
      <text x="87" y="80" fill="#f43f5e" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">r (rī)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">人 (လူ) • 日 (နေမင်း)</text>
    </g>

    <!-- Row 6: ㄗ ㄘ ㄙ -->
    <!-- ㄗ (z) -->
    <g transform="translate(0, 650)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄗ</text>
      <text x="87" y="80" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">z (zī)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">早 (စော) • 字 (စာလုံး)</text>
    </g>

    <!-- ㄘ (c) -->
    <g transform="translate(187, 650)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄘ</text>
      <text x="87" y="80" fill="#fb7185" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">c (cī) 💨</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">菜 (ဟင်း) • 词 (စကား)</text>
    </g>

    <!-- ㄙ (s) -->
    <g transform="translate(374, 650)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄙ</text>
      <text x="87" y="80" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">s (sī)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">四 (၄) • 三 (၃)</text>
    </g>

    <!-- Placeholder block -->
    <g transform="translate(561, 650)">
      <rect width="175" height="118" rx="12" fill="#0f172a" stroke="#334155" stroke-dasharray="4 4"/>
      <text x="87" y="65" fill="#475569" font-size="12" text-anchor="middle">(舌尖前 - Dental)</text>
    </g>

  </g>

  <!-- Bottom Tip -->
  <g transform="translate(40, 935)">
    <text x="380" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
      💡 注音符號 (Bopomofo) သည် တရုတ်ပြည်မကြီးတွင် Pinyin (၁၉၅၈) မတိုင်မီ တရားဝင်သုံးစွဲခဲ့သော တရုတ်အသံထွက် သင်္ကေတများဖြစ်ပါသည်
    </text>
  </g>
</svg>
