      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄉ</text>
      <text x="87" y="80" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">d (dē)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">大 (ကြီး) • 的 (၏)</text>
    </g>

    <!-- ㄊ (t) -->
    <g transform="translate(187, 130)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄊ</text>
      <text x="87" y="80" fill="#fb7185" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">t (tē) 💨</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">他 (သူ) • 太 (လွန်ကဲ)</text>
    </g>

    <!-- ㄋ (n) -->
    <g transform="translate(374, 130)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄋ</text>
      <text x="87" y="80" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">n (nē)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">你 (မင်း) • 年 (နှစ်)</text>
    </g>

    <!-- ㄌ (l) -->
    <g transform="translate(561, 130)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄌ</text>
      <text x="87" y="80" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">l (lē)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">来 (လာ) • 累 (ပင်ပန်း)</text>
    </g>

    <!-- Row 3: ㄍ ㄎ ㄏ -->
    <!-- ㄍ (g) -->
    <g transform="translate(0, 260)">
      <rect width="175" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="87" y="55" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="44" font-weight="bold" text-anchor="middle">ㄍ</text>
      <text x="87" y="80" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">g (gē)</text>
      <text x="87" y="102" fill="#facc15" font-family="sans-serif" font-size="13" text-anchor="middle">哥 (အစ်ကို) • 工</text>
    </g>

    <!-- ㄎ (k) -->
    <g transform="translate(187, 260)">
