<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradL7_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGradL7_1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowL7_1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="620" rx="18" fill="url(#bgGradL7_1)" stroke="#334155" stroke-width="2"/>

  <!-- Header Section -->
  <g transform="translate(40, 24)">
    <text x="390" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">
      တရုတ်မိသားစု ဆွေမျိုးတော်စပ်ပုံနှင့် လူဦးရေပြစကားလုံးများ (Chinese Kinship &amp; Measure Words)
    </text>
    <text x="390" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
      မိသားစုဝင် ရေတွက်စကားလုံး "口" (kǒu) • "两" နှင့် "二" အသုံးပြုပုံ စည်းမျဉ်း
    </text>
  </g>

  <!-- Section 1: Family Kinship Hierarchy (အပေါ်ပိုင်း) -->
  <g transform="translate(40, 85)">
    <rect width="780" height="235" rx="14" fill="url(#cardGradL7_1)" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadowL7_1)"/>
    
    <text x="24" y="28" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">
      👨‍👩‍👧‍👦 ၁။ မိသားစုဝင် ဆွေမျိုးတော်စပ်ပုံ အခေါ်အဝေါ်များ (Family Kinship Hierarchy)
    </text>

    <!-- Grandparents Tier -->
    <g transform="translate(260, 42)">
      <rect width="120" height="48" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
      <text x="60" y="22" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">爷爷 yéye</text>
      <text x="60" y="40" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">ဖခင်ဘက် အဖိုး</text>

      <rect x="140" width="120" height="48" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
      <text x="200" y="22" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">奶奶 nǎinai</text>
      <text x="200" y="40" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">ဖခင်ဘက် အဖွား</text>
    </g>

    <!-- Connector Line 1 -->
    <path d="M 390 90 L 390 102" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Parents Tier -->
    <g transform="translate(260, 104)">
      <rect width="120" height="48" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.2"/>
      <text x="60" y="22" fill="#93c5fd" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">爸爸 bàba</text>
      <text x="60" y="40" fill="#dbeafe" font-family="sans-serif" font-size="11" text-anchor="middle">ဖခင် (အဖေ)</text>

      <rect x="140" width="120" height="48" rx="8" fill="#831843" stroke="#f472b6" stroke-width="1.2"/>
      <text x="200" y="22" fill="#fbcfe8" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">妈妈 māma</text>
      <text x="200" y="40" fill="#fce7f3" font-family="sans-serif" font-size="11" text-anchor="middle">မိခင် (အမေ)</text>
    </g>

    <!-- Connector Line 2 -->
    <path d="M 390 152 L 390 164" stroke="#64748b" stroke-width="1.5"/>

    <!-- Siblings & Spouse Tier -->
    <g transform="translate(20, 168)">
      <!-- 哥哥 -->
      <g transform="translate(0, 0)">
        <rect width="112" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="56" y="22" fill="#38bdf8" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">哥哥 gēge</text>
        <text x="56" y="40" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">အစ်ကို (Elder Bro)</text>
      </g>

      <!-- 姐姐 -->
      <g transform="translate(124, 0)">
        <rect width="112" height="50" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1"/>
        <text x="56" y="22" fill="#f472b6" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">姐姐 jiějie</text>
        <text x="56" y="40" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">အစ်မ (Elder Sis)</text>
      </g>

      <!-- 我 (Me - Highlight) -->
      <g transform="translate(248, 0)">
        <rect width="120" height="50" rx="8" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
        <text x="60" y="22" fill="#a7f3d0" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">我 wǒ</text>
        <text x="60" y="40" fill="#ecfdf5" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ကျွန်ုပ် / မိမိ (Me)</text>
      </g>

      <!-- 弟弟 -->
      <g transform="translate(380, 0)">
        <rect width="112" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="56" y="22" fill="#38bdf8" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">弟弟 dìdi</text>
        <text x="56" y="40" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">ညီ / မောင် (Younger)</text>
      </g>

      <!-- 妹妹 -->
      <g transform="translate(504, 0)">
        <rect width="112" height="50" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1"/>
        <text x="56" y="22" fill="#f472b6" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">妹妹 mèimei</text>
        <text x="56" y="40" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">ညီမ (Younger Sis)</text>
      </g>

      <!-- 爱人 / 孩子 -->
      <g transform="translate(628, 0)">
        <rect width="112" height="50" rx="8" fill="#701a75" stroke="#e879f9" stroke-width="1"/>
        <text x="56" y="22" fill="#f5d0fe" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">爱人 / 孩子</text>
        <text x="56" y="40" fill="#fae8ff" font-family="sans-serif" font-size="10" text-anchor="middle">အိမ်ထောင်ဖက် / ကလေး</text>
      </g>
    </g>
  </g>

  <!-- Bottom Columns: Measure Words (ဘယ်) + "两" vs "二" Rule (ညာ) -->
  <g transform="translate(40, 335)">
    <!-- Column A: Measure Word "口" vs "个" vs "位" -->
    <g transform="translate(0, 0)">
      <rect width="380" height="260" rx="14" fill="url(#cardGradL7_1)" stroke="#f59e0b" stroke-width="1.2" filter="url(#shadowL7_1)"/>
      <text x="20" y="28" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="bold">
        👄 ၂။ လူဦးရေပြစကားလုံးများ နှိုင်းယှဉ်ချက် (Measure Words)
      </text>

      <!-- Box A1: 口 (kǒu) -->
      <g transform="translate(16, 42)">
        <rect width="348" height="62" rx="8" fill="#451a03" stroke="#d97706" stroke-width="1"/>
        <text x="14" y="24" fill="#fbbf24" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="bold">口 (kǒu) : မိသားစုဝင် ရေတွက်ရန် သီးသန့်</text>
        <text x="14" y="42" fill="#fef3c7" font-family="sans-serif" font-size="11">
          "အိမ်ထောင်စုထဲ ထမင်းကျွေးမွေးရမည့် ပါးစပ်ပေါက်" အဓိပ္ပာယ်မှ ဆင်းသက်
        </text>
        <text x="14" y="56" fill="#fde68a" font-family="monospace" font-size="11">
          ✓ 你家有几口人？ | ✓ 四口人 (၄ ယောက်)
        </text>
      </g>

      <!-- Box A2: 个 (gè) -->
      <g transform="translate(16, 114)">
        <rect width="348" height="62" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
        <text x="14" y="24" fill="#94a3b8" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold">个 (gè) : ယေဘုယျ လူဦးရေ ရေတွက်ရန်</text>
        <text x="14" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="11">
          ကျောင်းသား၊ သူငယ်ချင်း၊ ကုမ္ပဏီဝန်ထမ်း စသည့် အထွေထွေလူများ
        </text>
        <text x="14" y="56" fill="#38bdf8" font-family="monospace" font-size="11">
          ✓ 几个学生 (ကျောင်းသား ၅-၆ ယောက်) | ✓ 两个朋友
        </text>
      </g>

      <!-- Box A3: 位 (wèi) -->
      <g transform="translate(16, 186)">
        <rect width="348" height="60" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <text x="14" y="22" fill="#6ee7b7" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold">位 (wèi) : လေးစားသမှုပြ ရေတွက်စကားလုံး</text>
        <text x="14" y="40" fill="#a7f3d0" font-family="sans-serif" font-size="11">
          ဆရာ/ဆရာမ၊ ဧည့်သည်၊ ဆရာဝန် စသည့် ပုဂ္ဂိုလ်များကို သုံးစွဲ
        </text>
        <text x="14" y="54" fill="#ecfdf5" font-family="monospace" font-size="11">
          ✓ 两位老师 (ဆရာ ၂ ဦး) | ✓ 这位大夫 (ဤဆရာဝန်ကြီး)
        </text>
      </g>
    </g>

    <!-- Column B: Rule of "两" vs "二" -->
    <g transform="translate(400, 0)">
      <rect width="380" height="260" rx="14" fill="url(#cardGradL7_1)" stroke="#a855f7" stroke-width="1.2" filter="url(#shadowL7_1)"/>
      <text x="20" y="28" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="bold">
        ⚖️ ၃။ "两" (liǎng) နှင့် "二" (èr) သုံးစွဲပုံ ခွဲခြားခြင်း
      </text>

      <!-- Box B1: Always 两 before Measure Words -->
      <g transform="translate(16, 42)">
        <rect width="348" height="96" rx="8" fill="#3b0764" stroke="#9333ea" stroke-width="1"/>
        <text x="14" y="22" fill="#c084fc" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold">
          စည်းမျဉ်း (၁) : အရေအတွက်ပြစကားလုံး (量词) ရှေ့တွင် "两" သုံးရမည်
        </text>
        <text x="14" y="42" fill="#e9d5ff" font-family="sans-serif" font-size="11">
          "၂" ခုကို အရေအတွက်ပြစကားလုံးနှင့် တွဲဆိုပါက "二" မသုံးရဘဲ "两" သုံးရပါသည်:
        </text>
        <text x="14" y="62" fill="#a7f3d0" font-family="monospace" font-size="12">
          ✓ 两口人 (လူ ၂ ယောက်) [❌ 二口人]
        </text>
        <text x="14" y="80" fill="#a7f3d0" font-family="monospace" font-size="12">
          ✓ 两个哥哥 (အစ်ကို ၂ ယောက်) | ✓ 两本书 (စာအုပ် ၂ အုပ်)
        </text>
      </g>

      <!-- Box B2: Numbers > 10 always 二 -->
      <g transform="translate(16, 148)">
        <rect width="348" height="98" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
        <text x="14" y="22" fill="#818cf8" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold">
          စည်းမျဉ်း (၂) : ၁၀ ထက်ကြီးသော ဂဏန်းများတွင် "二" သာသုံးသည်
        </text>
        <text x="14" y="42" fill="#c7d2fe" font-family="sans-serif" font-size="11">
          ၁၂၊ ၂၀၊ ၂၂ စသည့် ဆယ်ဂဏန်းများတွင် အရေအတွက်ပြစကားလုံး ပါစေကာမူ "二":
        </text>
        <text x="14" y="62" fill="#fde68a" font-family="monospace" font-size="12">
          ✓ 十二点 (၁၂ နာရီ) [❌ 十两点]
        </text>
        <text x="14" y="80" fill="#fde68a" font-family="monospace" font-size="12">
          ✓ 二十二个学生 (ကျောင်းသား ၂၂ ယောက်)
        </text>
      </g>
    </g>
  </g>
</svg>
