<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradL8_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="clockGradL8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="shadowL8_1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="620" rx="18" fill="url(#bgGradL8_1)" stroke="#334155" stroke-width="2"/>

  <!-- Header Section -->
  <g transform="translate(40, 24)">
    <text x="390" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">
      တရုတ်နာရီနှင့် အချိန်ဖော်ပြနည်းစနစ် (Chinese Clock &amp; Time Expressions)
    </text>
    <text x="390" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
      "点" (နာရီ) • "分" (မိနစ်) • "半" (ခွဲ) • "刻" (မတ်) • "差" (လို) နှင့် အထူးစည်းမျဉ်းများ
    </text>
  </g>

  <!-- Left: Interactive Clock Face Diagram -->
  <g transform="translate(40, 85)">
    <rect width="360" height="510" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadowL8_1)"/>
    <text x="180" y="32" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      ⏰ တရုတ်နာရီ မျက်နှာပြင် (Clock Face)
    </text>

    <!-- Clock Circle -->
    <g transform="translate(180, 200)">
      <!-- Outer Dial -->
      <circle r="145" fill="url(#clockGradL8)" stroke="#38bdf8" stroke-width="3"/>
      <!-- Inner Ring -->
      <circle r="135" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- 12 Hours Numbers -->
      <!-- 12 -->
      <text x="0" y="-108" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">12 点</text>
      <!-- 3 -->
      <text x="108" y="6" fill="#facc15" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">15分 / 一刻</text>
      <!-- 6 -->
      <text x="0" y="118" fill="#34d399" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">30分 / 半</text>
      <!-- 9 -->
      <text x="-108" y="6" fill="#f472b6" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">45分 / 差一刻</text>

      <!-- Intermediate Hours -->
      <text x="56" y="-88" fill="#94a3b8" font-size="12" text-anchor="middle">1</text>
      <text x="96" y="-48" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">2 (两点)</text>
      <text x="96" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">4</text>
      <text x="56" y="96" fill="#94a3b8" font-size="12" text-anchor="middle">5</text>
      <text x="-56" y="96" fill="#94a3b8" font-size="12" text-anchor="middle">7</text>
      <text x="-96" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">8</text>
      <text x="-96" y="-48" fill="#94a3b8" font-size="12" text-anchor="middle">10</text>
      <text x="-56" y="-88" fill="#94a3b8" font-size="12" text-anchor="middle">11</text>

      <!-- Hands: Showing 7:25 (Lesson Sentence 038) -->
      <!-- Hour Hand (Pointing to ~7.4) -->
      <line x1="0" y1="0" x2="-42" y2="52" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      <!-- Minute Hand (Pointing to 25 mins / 5) -->
      <line x1="0" y1="0" x2="48" y2="84" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Center Pin -->
      <circle r="5" fill="#f8fafc"/>
    </g>

    <!-- Sentence Display under clock -->
    <g transform="translate(20, 375)">
      <rect width="320" height="115" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="160" y="26" fill="#facc15" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
        七点二十五分 (qī diǎn èrshíwǔ fēn)
      </text>
      <text x="160" y="48" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
        ၇ နာရီ ၂၅ မိနစ်
      </text>
      <text x="160" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">
        လက်တံတို (Hour) = 点 (diǎn)
      </text>
      <text x="160" y="88" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">
        လက်တံရှည် (Minute) = 分 (fēn)
      </text>
    </g>
  </g>

  <!-- Right: 4 Key Time Expression Blocks -->
  <g transform="translate(420, 85)">
    <!-- Block 1: Half past & Quarter past -->
    <g transform="translate(0, 0)">
      <rect width="400" height="115" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.2" filter="url(#shadowL8_1)"/>
      <text x="16" y="24" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">
        🌿 ၁။ နာရီခွဲ (半) နှင့် တစ်မတ် (一刻)
      </text>
      <text x="16" y="46" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold">
        半 (bàn) = ၃၀ မိနစ် (ခွဲ) • 一刻 (yí kè) = ၁၅ မိနစ် (မတ်)
      </text>
      <text x="16" y="68" fill="#cbd5e1" font-family="monospace" font-size="12">
        ✓ 六点半 (liù diǎn bàn) = ၆ နာရီခွဲ
      </text>
      <text x="16" y="88" fill="#cbd5e1" font-family="monospace" font-size="12">
        ✓ 八点一刻 (bā diǎn yí kè) = ၈ နာရီ ၁၅ မိနစ် (၈ နာရီ ၁ မတ်)
      </text>
    </g>

    <!-- Block 2: "To the hour" (差) -->
    <g transform="translate(0, 130)">
      <rect width="400" height="125" rx="12" fill="#0f172a" stroke="#f472b6" stroke-width="1.2" filter="url(#shadowL8_1)"/>
      <text x="16" y="24" fill="#f472b6" font-family="sans-serif" font-size="13" font-weight="bold">
        ⏳ ၂။ နာရီထိုးရန် လိုသော အချိန်ဖော်ပြခြင်း (差 chà)
      </text>
      <text x="16" y="46" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="bold">
        差 + လိုသောမိနစ် + နောက်နာရီ = (ထိုးရန် ... မိနစ်အလို)
      </text>
      <text x="16" y="70" fill="#fbcfe8" font-family="monospace" font-size="12">
        ✓ 差一刻八点 = ၈ နာရီထိုးရန် ၁၅ မိနစ်အလို (7:45)
      </text>
      <text x="16" y="90" fill="#fbcfe8" font-family="monospace" font-size="12">
        ✓ 差十分两点 = ၂ နာရီထိုးရန် ၁၀ မိနစ်အလို (1:50)
      </text>
      <text x="16" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">
        မြန်မာလို : "၈ နာရီထိုးဖို့ တစ်မတ်အလို" ပုံစံနှင့် အတိအကျတူညီ
      </text>
    </g>

    <!-- Block 3: Strict Rule: 2 O'Clock is 两点 (NEVER 二点) -->
    <g transform="translate(0, 270)">
      <rect width="400" height="110" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.2" filter="url(#shadowL8_1)"/>
      <text x="16" y="24" fill="#f87171" font-family="sans-serif" font-size="13" font-weight="bold">
        ⚠️ ၃။ အထူးစည်းမျဉ်း : ၂ နာရီကို "两点" သာသုံးရမည်!
      </text>
      <text x="16" y="50" fill="#fee2e2" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="bold">
        ✓ 两点 (liǎng diǎn) [ ❌ 二点 èr diǎn မသုံးရ ]
      </text>
      <text x="16" y="74" fill="#fef2f2" font-family="sans-serif" font-size="12">
        "点" သည် အချိန်ပြ အရေအတွက်စကားလုံးဖြစ်၍ "两" ကိုသာ သုံးရပါသည်:
      </text>
      <text x="16" y="94" fill="#fbbf24" font-family="monospace" font-size="12">
        ✓ 两点零五分 (2:05) | ✓ 差十分两点 (1:50)
      </text>
    </g>

    <!-- Block 4: Zero in minutes (零 líng) -->
    <g transform="translate(0, 395)">
      <rect width="400" height="115" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadowL8_1)"/>
      <text x="16" y="24" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">
        0️⃣ ၄။ ၁ မိနစ်မှ ၉ မိနစ်အထိ "零" (líng) ထည့်သွင်းဖတ်ခြင်း
      </text>
      <text x="16" y="48" fill="#f8fafc" font-family="sans-serif" font-size="12">
        မိနစ်နေရာတွင် ဂဏန်း ၁ လုံးတည်းရှိပါက "သုည" (零) ထည့်ဖတ်ပါသည်:
      </text>
      <text x="16" y="72" fill="#7dd3fc" font-family="monospace" font-size="13">
        ✓ 6:05 ➔ 六点零五分 (liù diǎn líng wǔ fēn)
      </text>
      <text x="16" y="94" fill="#7dd3fc" font-family="monospace" font-size="13">
        ✓ 2:05 ➔ 两点零五分 (liǎng diǎn líng wǔ fēn)
      </text>
    </g>
  </g>
</svg>
