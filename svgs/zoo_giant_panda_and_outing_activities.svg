<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="pandaCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="900" height="480" fill="url(#bgGrad)" rx="16" />

  <!-- Outer Header -->
  <text x="450" y="42" font-family="'Noto Sans SC', sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    第十七课：去动物园 • 北京休闲活动与户外出行
  </text>
  <text x="450" y="66" font-family="'Noto Sans Myanmar', sans-serif" font-size="13" fill="#6ee7b7" text-anchor="middle">
    သင်ခန်းစာ (၁၇) - တိရစ္ဆာန်ရုံသို့ သွားခြင်း (去动物园) • ပန်ဒါကြီးကြည့်ရှုခြင်းနှင့် ပန်းခြံအပန်းဖြေခရီးစဉ်
  </text>

  <!-- Left Card: Beijing Zoo & Giant Panda (大熊猫) -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect width="400" height="340" rx="16" fill="url(#pandaCardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="2" />

    <!-- Top Badge -->
    <rect x="20" y="20" width="160" height="30" rx="15" fill="url(#greenGrad)" />
    <text x="100" y="40" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      动物园与大熊猫 (Zoo)
    </text>

    <!-- Giant Panda Vector Art -->
    <g transform="translate(200, 135)">
      <!-- Bamboo stalks behind -->
      <g stroke="#15803d" stroke-width="6" stroke-linecap="round">
        <line x1="-90" y1="-70" x2="-80" y2="70" />
        <line x1="85" y1="-70" x2="75" y2="70" />
      </g>
      <g stroke="#22c55e" stroke-width="3" stroke-linecap="round">
        <line x1="-80" y1="-40" x2="-60" y2="-50" />
        <line x1="-85" y1="10" x2="-65" y2="0" />
        <line x1="80" y1="-30" x2="60" y2="-40" />
        <line x1="75" y1="20" x2="55" y2="10" />
      </g>

      <!-- Panda Body -->
      <ellipse cx="0" cy="25" rx="55" ry="42" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
      <!-- Black arms / legs -->
      <ellipse cx="-45" cy="18" rx="16" ry="26" fill="#0f172a" transform="rotate(20 -45 18)" />
      <ellipse cx="45" cy="18" rx="16" ry="26" fill="#0f172a" transform="rotate(-20 45 18)" />
      <ellipse cx="-32" cy="55" rx="14" ry="18" fill="#0f172a" />
      <ellipse cx="32" cy="55" rx="14" ry="18" fill="#0f172a" />

      <!-- Panda Head -->
      <circle cx="0" cy="-22" r="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Black Ears -->
      <circle cx="-32" cy="-55" r="14" fill="#0f172a" />
      <circle cx="32" cy="-55" r="14" fill="#0f172a" />

      <!-- Black Eye Patches -->
      <ellipse cx="-16" cy="-22" rx="12" ry="16" fill="#0f172a" transform="rotate(-15 -16 -22)" />
      <ellipse cx="16" cy="-22" rx="12" ry="16" fill="#0f172a" transform="rotate(15 16 -22)" />
      <!-- White Pupil Dots -->
      <circle cx="-14" cy="-22" r="3.5" fill="#ffffff" />
      <circle cx="14" cy="-22" r="3.5" fill="#ffffff" />

      <!-- Nose and Mouth -->
      <ellipse cx="0" cy="-8" rx="7" ry="5" fill="#0f172a" />
      <path d="M-6 -2 Q0 4 6 -2" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

      <!-- Fresh Bamboo leaf in hands -->
      <path d="M-20 20 Q0 5 25 15" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Details Text -->
    <text x="200" y="245" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="bold" fill="#6ee7b7" text-anchor="middle">
      去动物园看大熊猫 • 行，还可以看熊猫呢
    </text>
    <text x="200" y="268" font-family="'Noto Sans Myanmar', sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">
      တိရစ္ဆာန်ရုံသို့သွားပြီး ပန်ဒါကြီးကြည့်ကြမယ် • အိုကေတယ်၊ ပန်ဒါကြီးပါ ကြည့်လို့ရတယ်
    </text>

    <!-- Tags -->
    <g transform="translate(30, 290)">
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#334155" />
      <text x="52" y="17" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">动物园 (Zoo)</text>

      <rect x="115" y="0" width="110" height="26" rx="6" fill="#334155" />
      <text x="170" y="17" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">大熊猫 (Panda)</text>

      <rect x="235" y="0" width="105" height="26" rx="6" fill="#334155" />
      <text x="287" y="17" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">玩儿玩儿 (Outing)</text>
    </g>
  </g>

  <!-- Right Card: Outing Activities & Transport (户外活动与交通) -->
  <g transform="translate(460, 90)" filter="url(#shadow)">
    <rect width="400" height="340" rx="16" fill="url(#pandaCardGrad)" stroke="#14b8a6" stroke-opacity="0.4" stroke-width="2" />

    <!-- Top Badge -->
    <rect x="20" y="20" width="180" height="30" rx="15" fill="url(#tealGrad)" />
    <text x="110" y="40" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      出行方式与休闲 (Transport)
    </text>

    <!-- Activity Icons Showcase -->
    <g transform="translate(30, 75)">
      <!-- 1. Boating in Beihai Park (划船) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="70" rx="10" fill="#1e293b" stroke="#334155" />
        <text x="15" y="25" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="bold" fill="#5eead4">
          🚣 划划船 (Rowing)
        </text>
        <text x="15" y="45" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#cbd5e1">
          北海公园看看花儿
        </text>
        <text x="15" y="60" font-family="'Noto Sans Myanmar', sans-serif" font-size="10" fill="#94a3b8">
          ပေဟိုင်ပန်းခြံတွင် လှေလှော်မည်
        </text>
      </g>

      <!-- 2. Cycling (骑自行车) -->
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="165" height="70" rx="10" fill="#1e293b" stroke="#334155" />
        <text x="15" y="25" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="bold" fill="#5eead4">
          🚲 骑自行车
        </text>
        <text x="15" y="45" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#cbd5e1">
          骑自行车去吧
        </text>
        <text x="15" y="60" font-family="'Noto Sans Myanmar', sans-serif" font-size="10" fill="#94a3b8">
          စက်ဘီးစီးပြီး သွားကြမည်
        </text>
      </g>

      <!-- 3. Airport Pick-up (去机场接人) -->
      <g transform="translate(0, 80)">
        <rect x="0" y="0" width="165" height="70" rx="10" fill="#1e293b" stroke="#334155" />
        <text x="15" y="25" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="bold" fill="#5eead4">
          ✈️ 机场接人
        </text>
        <text x="15" y="45" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#cbd5e1">
          去机场接李成日
        </text>
        <text x="15" y="60" font-family="'Noto Sans Myanmar', sans-serif" font-size="10" fill="#94a3b8">
          လေဆိပ်သို့ သွားကြိုမည်
        </text>
      </g>

      <!-- 4. Weather Exclamation (天气多好啊) -->
      <g transform="translate(175, 80)">
        <rect x="0" y="0" width="165" height="70" rx="10" fill="#1e293b" stroke="#334155" />
        <text x="15" y="25" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="bold" fill="#5eead4">
          ☀️ 天气多好啊
        </text>
        <text x="15" y="45" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#cbd5e1">
          这两天天气很好
        </text>
        <text x="15" y="60" font-family="'Noto Sans Myanmar', sans-serif" font-size="10" fill="#94a3b8">
          ရာသီဥတု သာယာလိုက်တာ
        </text>
      </g>
    </g>

    <!-- Transport Bottom Feature -->
    <g transform="translate(30, 245)">
      <rect x="0" y="0" width="340" height="72" rx="10" fill="#0f172a" stroke="#0d9488" stroke-width="1.5" />
      <text x="15" y="24" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="bold" fill="#99f6e4">
        🚆 连动句方式: 坐地铁 / 坐车 / 骑车
      </text>
      <text x="15" y="44" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#e2e8f0">
        例: <tspan fill="#5eead4" font-weight="bold">骑自行车</tspan>去动物园 • <tspan fill="#5eead4" font-weight="bold">坐车</tspan>去机场
      </text>
      <text x="15" y="62" font-family="'Noto Sans Myanmar', sans-serif" font-size="11" fill="#94a3b8">
        နည်းလမ်း/ယာဉ် + သွားမည့်နေရာ ပုံစံဖြင့် အစဉ်အတိုင်း ဖော်ပြသည်။
      </text>
    </g>
  </g>

  <!-- Bottom Tip Banner -->
  <rect x="120" y="445" width="660" height="25" rx="6" fill="#1e293b" opacity="0.8" />
  <text x="450" y="462" font-family="'Noto Sans Myanmar', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    💡 စကားပြောအသုံး: "这两天" သည် မကြာသေးမီက ရက်ပိုင်းကို ပြပြီး "多……啊！" သည် ချီးကျူးအာမေဍိတ် ဖော်ပြသော ဝါကျဖြစ်ပါသည်။
  </text>
</svg>
