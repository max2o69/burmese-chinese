<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="350" rx="16" fill="url(#bgGrad4)" filter="url(#shadow4)"/>

  <!-- Title -->
  <text x="40" y="45" fill="#f5e0dc" font-size="20" font-family="'Segoe UI', 'Noto Sans Myanmar', sans-serif" font-weight="bold">တရုတ်စာလုံးများ ဖွဲ့စည်းပုံ မှတ်သားနည်း (Hanzi Etymology & Radicals)</text>
  <text x="40" y="72" fill="#a6adc8" font-size="13" font-family="'Segoe UI', 'Noto Sans Myanmar', sans-serif">တရုတ်စာလုံးများသည် အစိတ်အပိုင်းငယ်များ (အခြေခံမူလ ရုပ်ပုံစာလုံးများ) ဖြင့် ပေါင်းစပ်ဖွဲ့စည်းထားပါသည်။</text>

  <!-- Left: Character "你" (You) -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="345" height="225" rx="12" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    
    <!-- Big Character -->
    <rect x="25" y="20" width="80" height="80" rx="8" fill="#1e1e2e" stroke="#89b4fa"/>
    <text x="65" y="75" fill="#89b4fa" font-size="48" font-weight="bold" text-anchor="middle">你</text>

    <!-- Details -->
    <text x="120" y="45" fill="#cdd6f4" font-size="18" font-weight="bold">nǐ (နီ)</text>
    <text x="120" y="70" fill="#a6e3a1" font-size="14" font-family="'Noto Sans Myanmar', sans-serif">မင်း / ခင်ဗျား / ရှင်</text>
    <text x="120" y="92" fill="#bac2de" font-size="12">You (singular)</text>

    <!-- Breakdown items -->
    <line x1="25" y1="115" x2="320" y2="115" stroke="#45475a"/>

    <rect x="25" y="130" width="45" height="45" rx="6" fill="#1e1e2e" stroke="#fab387"/>
    <text x="47" y="160" fill="#fab387" font-size="24" text-anchor="middle">亻</text>
    <text x="85" y="148" fill="#fab387" font-size="12" font-weight="bold">လူအမှတ်အသား (Person Radical - 单人旁)</text>
    <text x="85" y="168" fill="#bac2de" font-size="11" font-family="'Noto Sans Myanmar', sans-serif">လူနှင့် သက်ဆိုင်သော စကားလုံးများတွင် သုံးသည်</text>

    <text x="25" y="205" fill="#cdd6f4" font-size="12" font-family="'Noto Sans Myanmar', sans-serif">💡 မှတ်ရန်: ကိုယ့်ရှေ့က "လူ" တစ်ယောက်ကို ညွှန်းဆို၍ "မင်း/သင်" ဖြစ်လာသည်။</text>
  </g>

  <!-- Right: Character "好" (Good) -->
  <g transform="translate(415, 95)">
    <rect x="0" y="0" width="345" height="225" rx="12" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>

    <!-- Big Character -->
    <rect x="25" y="20" width="80" height="80" rx="8" fill="#1e1e2e" stroke="#a6e3a1"/>
    <text x="65" y="75" fill="#a6e3a1" font-size="48" font-weight="bold" text-anchor="middle">好</text>

    <!-- Details -->
    <text x="120" y="45" fill="#cdd6f4" font-size="18" font-weight="bold">hǎo (ဟောင်)</text>
    <text x="120" y="70" fill="#a6e3a1" font-size="14" font-family="'Noto Sans Myanmar', sans-serif">ကောင်းသော / ကောင်းမွန်သည်</text>
    <text x="120" y="92" fill="#bac2de" font-size="12">Good / Well / Fine</text>

    <!-- Breakdown items -->
    <line x1="25" y1="115" x2="320" y2="115" stroke="#45475a"/>

    <!-- Woman + Child -->
    <rect x="25" y="130" width="45" height="45" rx="6" fill="#1e1e2e" stroke="#f38ba8"/>
    <text x="47" y="160" fill="#f38ba8" font-size="22" text-anchor="middle">女</text>
    <text x="85" y="145" fill="#f38ba8" font-size="11" font-weight="bold">အမျိုးသမီး/မိခင် (Woman)</text>

    <text x="195" y="158" fill="#cdd6f4" font-size="18">+</text>

    <rect x="215" y="130" width="45" height="45" rx="6" fill="#1e1e2e" stroke="#89b4fa"/>
    <text x="237" y="160" fill="#89b4fa" font-size="22" text-anchor="middle">子</text>
    <text x="270" y="152" fill="#89b4fa" font-size="11" font-weight="bold">သားသမီး (Child)</text>

    <text x="25" y="205" fill="#cdd6f4" font-size="12" font-family="'Noto Sans Myanmar', sans-serif">💡 မှတ်ရန်: မိခင်နှင့် သားသမီး အတူရှိနေခြင်းသည် "မင်္ဂလာရှိ ကောင်းမွန်ခြင်း" ဖြစ်သည်။</text>
  </g>
</svg>
