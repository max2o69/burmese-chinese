<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="900" height="480" fill="url(#bgGrad)" rx="16" />

  <!-- Outer Title -->
  <text x="450" y="40" font-family="'Noto Sans SC', sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    语法核心：选择疑问句（还是）与趋向补语（来/去）
  </text>
  <text x="450" y="64" font-family="'Noto Sans Myanmar', sans-serif" font-size="13" fill="#5eead4" text-anchor="middle">
    ရွေးချယ်မှုမေးခွန်း "还是" (ဒါမှမဟုတ်) နှင့် ဦးတည်ချက်ပြ အဖြည့်ပုဒ်များ (趋向补语: 来 vs 去)
  </text>

  <!-- Left Card: Alternative Questions with 还是 -->
  <g transform="translate(40, 85)" filter="url(#shadow)">
    <rect width="400" height="350" rx="16" fill="url(#cardGrad)" stroke="#14b8a6" stroke-opacity="0.4" stroke-width="2" />

    <!-- Badge -->
    <rect x="20" y="20" width="180" height="30" rx="15" fill="url(#tealGrad)" />
    <text x="110" y="40" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      1. 选择疑问句 (还是)
    </text>

    <!-- Question Fork Diagram -->
    <g transform="translate(30, 75)">
      <!-- Central Stem -->
      <line x1="20" y1="50" x2="120" y2="50" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
      <circle cx="20" cy="50" r="7" fill="#14b8a6" />

      <!-- Branch A (Top) -->
      <path d="M120 50 Q160 50 180 20 L280 20" fill="none" stroke="#2dd4bf" stroke-width="2.5" />
      <rect x="280" y="5" width="75" height="30" rx="6" fill="#1e293b" stroke="#2dd4bf" />
      <text x="317" y="25" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">选项 A</text>

      <!-- Fork Node: 还是 -->
      <circle cx="150" cy="50" r="16" fill="#0f766e" stroke="#2dd4bf" stroke-width="2" />
      <text x="150" y="55" font-family="'Noto Sans SC', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">还是</text>

      <!-- Branch B (Bottom) -->
      <path d="M120 50 Q160 50 180 80 L280 80" fill="none" stroke="#2dd4bf" stroke-width="2.5" />
      <rect x="280" y="65" width="75" height="30" rx="6" fill="#1e293b" stroke="#2dd4bf" />
      <text x="317" y="85" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">选项 B</text>
    </g>

    <!-- Formula & Contrast Box -->
    <g transform="translate(20, 185)">
      <rect x="0" y="0" width="360" height="135" rx="10" fill="#1e293b" stroke="#334155" />
      <text x="15" y="24" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="bold" fill="#5eead4">
        📌 经典例句 (Examples):
      </text>

      <text x="15" y="48" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#ffffff">
        • 他上午到<tspan fill="#2dd4bf" font-weight="bold">还是</tspan>下午到？
      </text>
      <text x="25" y="64" font-family="'Noto Sans Myanmar', sans-serif" font-size="10.5" fill="#94a3b8">
        (သူ မနက်ပိုင်း ရောက်မှာလား၊ ဒါမှမဟုတ် ညနေပိုင်း ရောက်မှာလား)
      </text>

      <text x="15" y="88" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#ffffff">
        • 你喝咖啡<tspan fill="#2dd4bf" font-weight="bold">还是</tspan>喝茶？
      </text>

      <!-- Crucial Rule Tag -->
      <rect x="15" y="102" width="330" height="24" rx="4" fill="#042f2e" />
      <text x="180" y="118" font-family="'Noto Sans Myanmar', sans-serif" font-size="10.5" font-weight="bold" fill="#fcd34d" text-anchor="middle">
        ⚠️ သတိပြုရန်: "还是" ကို မေးခွန်းတွင်သာ သုံးသည် (သို့မဟုတ်)
      </text>
    </g>
  </g>

  <!-- Right Card: Directional Complements 来 vs 去 -->
  <g transform="translate(460, 85)" filter="url(#shadow)">
    <rect width="400" height="350" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="2" />

    <!-- Badge -->
    <rect x="20" y="20" width="190" height="30" rx="15" fill="url(#emeraldGrad)" />
    <text x="115" y="40" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      2. 趋向补语 (来 vs 去)
    </text>

    <!-- Direction Visual Illustration -->
    <g transform="translate(30, 75)">
      <!-- Speaker reference point (Center) -->
      <circle cx="170" cy="45" r="26" fill="#065f46" stroke="#34d399" stroke-width="2" />
      <text x="170" y="42" font-family="'Noto Sans SC', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">说话人</text>
      <text x="170" y="56" font-family="'Noto Sans Myanmar', sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">ပြောသူ</text>

      <!-- Towards Speaker: 来 -->
      <g transform="translate(30, 30)">
        <path d="M0 15 L90 15" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)" />
        <polygon points="90,10 102,15 90,20" fill="#34d399" />
        <text x="45" y="5" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="bold" fill="#6ee7b7" text-anchor="middle">向着ပြောသူ</text>
        <text x="45" y="32" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">…… + 来</text>
      </g>

      <!-- Away from Speaker: 去 -->
      <g transform="translate(210, 30)">
        <polygon points="102,10 114,15 102,20" fill="#f87171" />
        <path d="M0 15 L102 15" fill="none" stroke="#f87171" stroke-width="3" />
        <text x="55" y="5" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="bold" fill="#fca5a5" text-anchor="middle">背离ပြောသူ</text>
        <text x="55" y="32" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">…… + 去</text>
      </g>
    </g>

    <!-- Contrast Grid -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="360" height="160" rx="10" fill="#1e293b" stroke="#334155" />

      <!-- Row 1: In / Out -->
      <g transform="translate(15, 20)">
        <rect x="0" y="0" width="160" height="38" rx="6" fill="#0f172a" />
        <text x="80" y="24" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle">
          进来 (ဝင်လာ)
        </text>
        
        <rect x="170" y="0" width="160" height="38" rx="6" fill="#0f172a" />
        <text x="250" y="24" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="bold" fill="#fca5a5" text-anchor="middle">
          出去 (ထွက်သွား)
        </text>
      </g>

      <!-- Row 2: Up / Down -->
      <g transform="translate(15, 66)">
        <rect x="0" y="0" width="160" height="38" rx="6" fill="#0f172a" />
        <text x="80" y="24" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle">
          上来 / 下来
        </text>

        <rect x="170" y="0" width="160" height="38" rx="6" fill="#0f172a" />
        <text x="250" y="24" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="bold" fill="#fca5a5" text-anchor="middle">
          上去 / 下去
        </text>
      </g>

      <!-- Example line -->
      <text x="180" y="130" font-family="'Noto Sans SC', sans-serif" font-size="11.5" fill="#e2e8f0" text-anchor="middle">
        • 上课了，快<tspan fill="#34d399" font-weight="bold">进来</tspan>吧！ (ပြောသူ အခန်းတွင်းရှိနေသည်)
      </text>
      <text x="180" y="148" font-family="'Noto Sans SC', sans-serif" font-size="11.5" fill="#e2e8f0" text-anchor="middle">
        • 他不在家，<tspan fill="#f87171" font-weight="bold">出去</tspan>了。 (ပြောသူ အိမ်တွင်းရှိနေသည်)
      </text>
    </g>
  </g>

  <!-- Bottom Tip Banner -->
  <rect x="120" y="445" width="660" height="25" rx="6" fill="#1e293b" opacity="0.8" />
  <text x="450" y="462" font-family="'Noto Sans Myanmar', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    💡 ဦးတည်ချက်မှတ်သားရန်: ပြောသူရှိရာဆီသို့ လာပါက "来" သုံးပြီး ပြောသူရှိရာမှ အဝေးသို့ သွားပါက "去" သုံးသည်။
  </text>
</svg>
