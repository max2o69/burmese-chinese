<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradL8_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#191d33"/>
    </linearGradient>
    <linearGradient id="cardGradL8_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowL8_2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="620" rx="18" fill="url(#bgGradL8_2)" stroke="#334155" stroke-width="2"/>

  <!-- Header Section -->
  <g transform="translate(40, 24)">
    <text x="390" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">
      အချိန်နှင့် နေရာပြ ဝါကျဖွဲ့စည်းပုံ ရွှေစည်းမျဉ်း (Time &amp; Place Word Order)
    </text>
    <text x="390" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
      အကြီးဆုံးမှ အသေးဆုံးသို့ အချိန်အစီအစဉ် • ကတ္တား + [အချိန်] + [နေရာ] + ကြိယာ • မြန်မာ-တရုတ် ထပ်တူကျမှု
    </text>
  </g>

  <!-- Section 1: Time Order: Big to Small (အပေါ်ပိုင်း) -->
  <g transform="translate(40, 85)">
    <rect width="780" height="135" rx="14" fill="url(#cardGradL8_2)" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadowL8_2)"/>
    <text x="20" y="26" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">
      ⏳ ၁။ အချိန်အစီအစဉ် : အကြီးဆုံး ယူနစ်မှ အသေးဆုံးသို့ (Largest to Smallest Time Unit)
    </text>

    <!-- 5 Stepped Blocks -->
    <g transform="translate(16, 42)">
      <!-- Year -->
      <g transform="translate(0, 0)">
        <rect width="136" height="70" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
        <text x="68" y="24" fill="#60a5fa" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">年 (nián)</text>
        <text x="68" y="44" fill="#facc15" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">၁။ နှစ် (Year)</text>
        <text x="68" y="60" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">二〇二六年</text>
      </g>
      <text x="144" y="42" fill="#64748b" font-size="16" font-weight="bold">➔</text>

      <!-- Month & Day -->
      <g transform="translate(160, 0)">
        <rect width="136" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="68" y="24" fill="#38bdf8" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">月 - 日/号</text>
        <text x="68" y="44" fill="#facc15" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">၂။ လ နှင့် ရက်</text>
        <text x="68" y="60" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">十月八号</text>
      </g>
      <text x="304" y="42" fill="#64748b" font-size="16" font-weight="bold">➔</text>

      <!-- Day Period -->
      <g transform="translate(320, 0)">
        <rect width="136" height="70" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
        <text x="68" y="24" fill="#34d399" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">上/下午/晚上</text>
        <text x="68" y="44" fill="#facc15" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">၃။ နေ့အချိန်ပိုင်း</text>
        <text x="68" y="60" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">晚上 (ညနေ)</text>
      </g>
      <text x="464" y="42" fill="#64748b" font-size="16" font-weight="bold">➔</text>

      <!-- Hour -->
      <g transform="translate(480, 0)">
        <rect width="120" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
        <text x="60" y="24" fill="#f59e0b" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">点 (diǎn)</text>
        <text x="60" y="44" fill="#facc15" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">၄။ နာရီ (Hour)</text>
        <text x="60" y="60" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">八点 / 七点半</text>
      </g>
      <text x="608" y="42" fill="#64748b" font-size="16" font-weight="bold">➔</text>

      <!-- Minute -->
      <g transform="translate(624, 0)">
        <rect width="120" height="70" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1"/>
        <text x="60" y="24" fill="#f472b6" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">分 (fēn)</text>
        <text x="60" y="44" fill="#facc15" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">၅။ မိနစ် (Min)</text>
        <text x="60" y="60" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">二十五分 / 一刻</text>
      </g>
    </g>
  </g>

  <!-- Section 2: The Golden Word Order (အလယ်ပိုင်း) -->
  <g transform="translate(40, 235)">
    <rect width="780" height="230" rx="14" fill="url(#cardGradL8_2)" stroke="#a855f7" stroke-width="1.2" filter="url(#shadowL8_2)"/>
    <text x="20" y="26" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold">
      👑 ၂။ တရုတ်-မြန်မာ ဝါကျတည်ဆောက်ပုံ ရွှေစည်းမျဉ်း (S + Time + Place + V + O)
    </text>

    <!-- Visual Sentence Breakdown Blocks -->
    <g transform="translate(20, 42)">
      <!-- Subject -->
      <g transform="translate(0, 0)">
        <rect width="110" height="64" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
        <text x="55" y="24" fill="#93c5fd" font-family="sans-serif" font-size="11" text-anchor="middle">主语 (Subject)</text>
        <text x="55" y="48" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">我 (Wǒ)</text>
      </g>
      <text x="116" y="40" fill="#64748b" font-size="18" font-weight="bold">+</text>

      <!-- Time Adverbial -->
      <g transform="translate(130, 0)">
        <rect width="210" height="64" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
        <text x="105" y="24" fill="#6ee7b7" font-family="sans-serif" font-size="11" text-anchor="middle">时间状语 (Time Adverbial)</text>
        <text x="105" y="48" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">今天晚上八点二十分</text>
      </g>
      <text x="346" y="40" fill="#64748b" font-size="18" font-weight="bold">+</text>

      <!-- Place Adverbial -->
      <g transform="translate(360, 0)">
        <rect width="160" height="64" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="80" y="24" fill="#fcd34d" font-family="sans-serif" font-size="11" text-anchor="middle">处所状语 (Place Adverbial)</text>
        <text x="80" y="48" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">在食堂 (zài shítáng)</text>
      </g>
      <text x="526" y="40" fill="#64748b" font-size="18" font-weight="bold">+</text>

      <!-- Verb + Object -->
      <g transform="translate(540, 0)">
        <rect width="190" height="64" rx="8" fill="#4a044e" stroke="#e879f9" stroke-width="1.2"/>
        <text x="95" y="24" fill="#f0abfc" font-family="sans-serif" font-size="11" text-anchor="middle">动词+宾语 (Verb + Object)</text>
        <text x="95" y="48" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">吃饭 (chī fàn)</text>
      </g>
    </g>

    <!-- Language Comparison Rows -->
    <g transform="translate(20, 120)">
      <!-- Burmese Match (Exact 100%) -->
      <rect width="740" height="42" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
      <text x="16" y="26" fill="#5eead4" font-family="sans-serif" font-size="12" font-weight="bold">
        🇲🇲 မြန်မာဝါကျ (ထပ်တူကျ) : <tspan fill="#f8fafc">ငါသည်</tspan> + <tspan fill="#6ee7b7">ဒီနေ့ည ၈:၂၀ တွင်</tspan> + <tspan fill="#fcd34d">ထမင်းစားဆောင်၌</tspan> + <tspan fill="#f0abfc">ထမင်းစားသည်</tspan> (၁၀၀% တူညီ)
      </text>

      <!-- English Inverted -->
      <g transform="translate(0, 50)">
        <rect width="740" height="42" rx="8" fill="#18181b" stroke="#71717a" stroke-width="1"/>
        <text x="16" y="26" fill="#a1a1aa" font-family="sans-serif" font-size="12">
          🇬🇧 အင်္ဂလိပ်ဝါကျ (ပြောင်းပြန်) : I + <tspan fill="#f0abfc">eat dinner</tspan> + <tspan fill="#fcd34d">at the dining hall</tspan> + <tspan fill="#6ee7b7">at 8:20 tonight</tspan> (နေရာနှင့် အချိန် အနောက်ပို့)
        </text>
      </g>
    </g>
  </g>

  <!-- Section 3: Time Word Placement Positions (အောက်ပိုင်း) -->
  <g transform="translate(40, 480)">
    <rect width="780" height="115" rx="14" fill="url(#cardGradL8_2)" stroke="#10b981" stroke-width="1.2" filter="url(#shadowL8_2)"/>
    <text x="20" y="24" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">
      💡 ၃။ အချိန်ပြစကားလုံး ထားနိုင်သော နေရာ (၂) နေရာ (Time Word Placement Positions)
    </text>

    <g transform="translate(16, 36)">
      <!-- Position A -->
      <g transform="translate(0, 0)">
        <rect width="365" height="64" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <text x="14" y="24" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="bold">
          နေရာ (က) : ကတ္တား၏ နောက် (Subject + Time + Verb)
        </text>
        <text x="14" y="48" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="bold">
          我 <tspan fill="#facc15">晚上</tspan> 看电视。 <tspan fill="#cbd5e1" font-size="11" font-family="sans-serif">(ငါ ညပိုင်း တီဗွီကြည့်တယ်)</tspan>
        </text>
      </g>

      <!-- Position B -->
      <g transform="translate(382, 0)">
        <rect width="365" height="64" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
        <text x="14" y="24" fill="#c7d2fe" font-family="sans-serif" font-size="12" font-weight="bold">
          နေရာ (ခ) : ကတ္တား၏ အရှေ့ (Time + Subject + Verb)
        </text>
        <text x="14" y="48" fill="#f8fafc" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="bold">
          <tspan fill="#facc15">晚上</tspan> 我 看电视。 <tspan fill="#cbd5e1" font-size="11" font-family="sans-serif">(ညပိုင်းမှာ ငါ တီဗွီကြည့်တယ်)</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
