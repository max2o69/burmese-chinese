<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradL6_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowL6_2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="520" rx="16" fill="url(#bgGradL6_2)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <g transform="translate(40, 24)">
    <text x="380" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">
      တစ်နေ့တာ အချိန်ပိုင်းများနှင့် အကြံပြုတိုင်ပင်ခြင်း “……好吗？” (Time &amp; Suggestions)
    </text>
    <text x="380" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
      မနက်၊ နေ့လယ်၊ ညနေပိုင်း အသုံးများနှင့် အစီအစဉ်ဆွဲရာတွင် သုံးသော “……好吗？”
    </text>
  </g>

  <!-- 4 Time Periods Grid -->
  <g transform="translate(40, 85)">
    <!-- 4 Cards -->
    <g transform="translate(0, 0)">
      <!-- Period 1: 上午 -->
      <g transform="translate(0, 0)">
        <rect width="175" height="180" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowL6_2)"/>
        <rect width="175" height="30" rx="10" fill="#0284c7"/>
        <text x="87" y="20" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">မနက်ပိုင်း (Morning)</text>
        <text x="87" y="65" fill="#38bdf8" font-family="'Noto Sans SC', sans-serif" font-size="26" font-weight="bold" text-anchor="middle">上午</text>
        <text x="87" y="90" fill="#facc15" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">shàngwǔ</text>
        <text x="87" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="11.5" text-anchor="middle">မနက် ၈:၃၀ မှ ၁၂:၀၀</text>
        <text x="87" y="145" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">• 上午去她家</text>
      </g>

      <!-- Period 2: 中午 -->
      <g transform="translate(195, 0)">
        <rect width="175" height="180" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadowL6_2)"/>
        <rect width="175" height="30" rx="10" fill="#d97706"/>
        <text x="87" y="20" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">နေ့လယ် ၁၂ (Noon)</text>
        <text x="87" y="65" fill="#f59e0b" font-family="'Noto Sans SC', sans-serif" font-size="26" font-weight="bold" text-anchor="middle">中午</text>
        <text x="87" y="90" fill="#facc15" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">zhōngwǔ</text>
        <text x="87" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="11.5" text-anchor="middle">နေ့လယ် ၁၂ မှ ၁:၀၀</text>
        <text x="87" y="145" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">• 中午休息</text>
      </g>

      <!-- Period 3: 下午 -->
      <g transform="translate(390, 0)">
        <rect width="175" height="180" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadowL6_2)"/>
        <rect width="175" height="30" rx="10" fill="#059669"/>
        <text x="87" y="20" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">နေ့လယ်ပိုင်း (Afternoon)</text>
        <text x="87" y="65" fill="#34d399" font-family="'Noto Sans SC', sans-serif" font-size="26" font-weight="bold" text-anchor="middle">下午</text>
        <text x="87" y="90" fill="#facc15" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">xiàwǔ</text>
        <text x="87" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="11.5" text-anchor="middle">နေ့လယ် ၁:၀၀ မှ ၆:၀၀</text>
        <text x="87" y="145" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">• 下午去书店</text>
      </g>

      <!-- Period 4: 晚上 -->
      <g transform="translate(585, 0)">
        <rect width="175" height="180" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadowL6_2)"/>
        <rect width="175" height="30" rx="10" fill="#7c3aed"/>
        <text x="87" y="20" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ညနေ/ညပိုင်း (Evening)</text>
        <text x="87" y="65" fill="#a78bfa" font-family="'Noto Sans SC', sans-serif" font-size="26" font-weight="bold" text-anchor="middle">晚上</text>
        <text x="87" y="90" fill="#facc15" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">wǎnshang</text>
        <text x="87" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="11.5" text-anchor="middle">ညနေ ၆:၀၀ မှ ညဉ့်နက်</text>
        <text x="87" y="145" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">• 晚上看电影</text>
      </g>
    </g>

    <!-- Suggestion Pattern: ......好吗？ -->
    <g transform="translate(0, 205)">
      <rect width="760" height="205" rx="14" fill="#0f172a" stroke="#e11d48" stroke-width="1.5"/>
      <text x="25" y="32" fill="#f43f5e" font-family="sans-serif" font-size="15" font-weight="bold">
        💬 အကြံပြု တိုင်ပင်ဆွေးနွေးခြင်း: “[အစီအစဉ်ဝါကျ] + 好吗？” (Is that okay?)
      </text>

      <g transform="translate(25, 48)">
        <!-- Formula Box -->
        <rect width="710" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="355" y="26" fill="#facc15" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">
          [ကျွန်ုပ်တို့ အစီအစဉ်] + 好吗 (hǎo ma) ？
        </text>

        <!-- Examples & Answers -->
        <g transform="translate(10, 58)" font-family="sans-serif">
          <text x="0" y="20" fill="#38bdf8" font-size="13.5" font-weight="bold">• 我们上午去她家，好吗？ (ငါတို့ မနက်ပိုင်း သူမအိမ် သွားကြမယ်၊ ကောင်းလား/ဟုတ်ပြီလား)</text>
          <text x="0" y="44" fill="#38bdf8" font-size="13.5" font-weight="bold">• 明天去买东西，好吗？ (မနက်ဖြန် စျေးဝယ်ထွက်ကြမယ်၊ ကောင်းလား)</text>
          
          <g transform="translate(0, 68)">
            <text x="0" y="16" fill="#22c55e" font-size="13" font-weight="bold">👉 သဘောတူ ဖြေဆိုနည်း:</text>
            <text x="180" y="16" fill="#facc15" font-family="monospace" font-size="13" font-weight="bold">好！ (Hǎo! - ကောင်းပြီ / ဟုတ်ပြီ)  •  好啊！ (Hǎo a! - သဘောတူတယ်)</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
