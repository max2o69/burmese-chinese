<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="440" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <g transform="translate(50, 25)">
    <text x="410" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
      တရုတ်ဘာသာ အတိုင်းအတာပြ ကြိယာဝိသေသနများ (Adverbs of Degree)
    </text>
    <text x="410" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
      "忙" (အလုပ်များခြင်း) ကို အတိုင်းအတာ ၄ ဆင့်ဖြင့် နှိုင်းယှဉ်လေ့လာခြင်း
    </text>
  </g>

  <!-- Progress Track Line -->
  <path d="M 120 160 L 800 160" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <path d="M 120 160 L 800 160" stroke="url(#trackGrad)" stroke-width="8" stroke-linecap="round"/>
  <defs>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="33%" stop-color="#0ea5e9"/>
      <stop offset="66%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- 4 Step Cards -->
  <!-- Step 1: 不忙 -->
  <g transform="translate(50, 105)">
    <circle cx="95" cy="55" r="16" fill="#64748b" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
    <text x="95" y="60" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">0%</text>
    <rect x="0" y="90" width="190" height="195" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="90" width="190" height="38" rx="10" fill="#334155"/>
    <text x="95" y="115" fill="#e2e8f0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">လုံးဝငြင်းဆိုခြင်း</text>
    
    <text x="95" y="155" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">不忙</text>
    <text x="95" y="180" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">bù máng</text>
    
    <rect x="15" y="195" width="160" height="1" fill="#475569"/>
    <text x="95" y="222" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">မများဘူး</text>
    <text x="95" y="242" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">ရိုးရိုးငြင်းဆိုမှု</text>
  </g>

  <!-- Step 2: 不太忙 -->
  <g transform="translate(265, 105)">
    <circle cx="95" cy="55" r="16" fill="#0ea5e9" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
    <text x="95" y="60" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">30%</text>
    <rect x="0" y="90" width="190" height="195" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="90" width="190" height="38" rx="10" fill="#0369a1"/>
    <text x="95" y="115" fill="#e0f2fe" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">အသင့်အတင့် ငြင်းဆိုခြင်း</text>
    
    <text x="95" y="155" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">不太忙</text>
    <text x="95" y="180" fill="#38bdf8" font-family="monospace" font-size="14" text-anchor="middle">bú tài máng</text>
    
    <rect x="15" y="195" width="160" height="1" fill="#475569"/>
    <text x="95" y="222" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">သိပ်မများဘူး</text>
    <text x="95" y="242" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">နူးညံ့သော အငြင်းစကား</text>
  </g>

  <!-- Step 3: 很忙 -->
  <g transform="translate(480, 105)">
    <circle cx="95" cy="55" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
    <text x="95" y="60" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">80%</text>
    <rect x="0" y="90" width="190" height="195" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="90" width="190" height="38" rx="10" fill="#b45309"/>
    <text x="95" y="115" fill="#fef3c7" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">အဆင့်မြင့် အတည်ပြုခြင်း</text>
    
    <text x="95" y="155" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">很忙</text>
    <text x="95" y="180" fill="#fbbf24" font-family="monospace" font-size="14" text-anchor="middle">hěn máng</text>
    
    <rect x="15" y="195" width="160" height="1" fill="#475569"/>
    <text x="95" y="222" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">အရမ်းများတယ်</text>
    <text x="95" y="242" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">အလွန်အမင်း ဖြစ်ပေါ်မှု</text>
  </g>

  <!-- Step 4: 太忙了 -->
  <g transform="translate(695, 105)">
    <circle cx="95" cy="55" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
    <text x="95" y="60" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">100%</text>
    <rect x="0" y="90" width="190" height="195" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="90" width="190" height="38" rx="10" fill="#b91c1c"/>
    <text x="95" y="115" fill="#fee2e2" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">လွန်ကဲစွာ ဖြစ်ပေါ်ခြင်း</text>
    
    <text x="95" y="155" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">太忙了</text>
    <text x="95" y="180" fill="#f87171" font-family="monospace" font-size="14" text-anchor="middle">tài máng le</text>
    
    <rect x="15" y="195" width="160" height="1" fill="#475569"/>
    <text x="95" y="222" fill="#f87171" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">များလွန်းတယ်!</text>
    <text x="95" y="242" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">太...了 ပုံစံဖြင့် သုံးသည်</text>
  </g>

  <!-- Bottom Tip -->
  <g transform="translate(50, 375)">
    <rect width="820" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="410" y="26" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
      💡 မှတ်သားချက်: "太" (tài) ကို အတည်ဝါကျတွင် သုံးပါက အဆုံးတွင် <tspan fill="#f87171" font-weight="bold">“了” (le)</tspan> တွဲစပ်လေ့ရှိပြီး၊ အငြင်းဝါကျတွင်မူ <tspan fill="#38bdf8" font-weight="bold">“不太” (bú tài)</tspan> ဟု သုံးပါသည်။
    </text>
  </g>
</svg>
