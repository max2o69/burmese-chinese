<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" rx="16" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Header -->
  <text x="40" y="45" fill="#f5e0dc" font-size="20" font-family="'Segoe UI', 'Noto Sans Myanmar', sans-serif" font-weight="bold">တရုတ်ဘာသာ အသံလှိုင်း (၄) မျိုး နှင့် မြန်မာအသံထွက် နှိုင်းယှဉ်ချက်</text>
  <text x="40" y="70" fill="#a6adc8" font-size="13" font-family="'Segoe UI', sans-serif">The 4 Tones of Mandarin Chinese vs Burmese Tones (Pitch 1 to 5)</text>

  <!-- Pitch Chart Area -->
  <g transform="translate(60, 90)">
    <!-- Pitch Lines (5 to 1) -->
    <line x1="40" y1="20" x2="680" y2="20" stroke="#45475a" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="15" y="25" fill="#f38ba8" font-size="13" font-weight="bold" font-family="sans-serif">5</text>
    <text x="700" y="25" fill="#a6adc8" font-size="11" font-family="'Noto Sans Myanmar', sans-serif">အမြင့်ဆုံးသံ</text>

    <line x1="40" y1="55" x2="680" y2="55" stroke="#45475a" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="15" y="60" fill="#fab387" font-size="13" font-family="sans-serif">4</text>

    <line x1="40" y1="90" x2="680" y2="90" stroke="#45475a" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="15" y="95" fill="#f9e2af" font-size="13" font-family="sans-serif">3</text>
    <text x="700" y="95" fill="#a6adc8" font-size="11" font-family="'Noto Sans Myanmar', sans-serif">အလတ်သံ</text>

    <line x1="40" y1="125" x2="680" y2="125" stroke="#45475a" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="15" y="130" fill="#a6e3a1" font-size="13" font-family="sans-serif">2</text>

    <line x1="40" y1="160" x2="680" y2="160" stroke="#45475a" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="15" y="165" fill="#89b4fa" font-size="13" font-weight="bold" font-family="sans-serif">1</text>
    <text x="700" y="165" fill="#a6adc8" font-size="11" font-family="'Noto Sans Myanmar', sans-serif">အနိမ့်ဆုံးသံ</text>

    <!-- Tone 1: High Level (55) -->
    <path d="M 60 20 L 180 20" stroke="#f38ba8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="60" cy="20" r="4" fill="#f38ba8"/>
    <circle cx="180" cy="20" r="4" fill="#f38ba8"/>

    <!-- Tone 2: Rising (35) -->
    <path d="M 220 90 Q 280 60 340 20" stroke="#a6e3a1" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="220" cy="90" r="4" fill="#a6e3a1"/>
    <circle cx="340" cy="20" r="4" fill="#a6e3a1"/>

    <!-- Tone 3: Falling-Rising (214) -->
    <path d="M 380 125 Q 430 170 460 160 Q 480 120 500 55" stroke="#89b4fa" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="380" cy="125" r="4" fill="#89b4fa"/>
    <circle cx="500" cy="55" r="4" fill="#89b4fa"/>

    <!-- Tone 4: Falling (51) -->
    <path d="M 540 20 L 660 160" stroke="#fab387" stroke-width="5" stroke-linecap="round"/>
    <circle cx="540" cy="20" r="4" fill="#fab387"/>
    <circle cx="660" cy="160" r="4" fill="#fab387"/>
  </g>

  <!-- Tone Cards (Bottom) -->
  <g transform="translate(60, 275)">
    <!-- Card 1 -->
    <rect x="35" y="0" width="140" height="85" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="105" y="24" fill="#f38ba8" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Noto Sans Myanmar', sans-serif">၁ သံ (ပထမသံ)</text>
    <text x="105" y="44" fill="#cdd6f4" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">mā (55)</text>
    <text x="105" y="65" fill="#bac2de" font-size="12" text-anchor="middle" font-family="'Noto Sans Myanmar', sans-serif">အသံမြင့်ညီ (မား~)</text>

    <!-- Card 2 -->
    <rect x="195" y="0" width="140" height="85" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="265" y="24" fill="#a6e3a1" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Noto Sans Myanmar', sans-serif">၂ သံ (ဒုတိယသံ)</text>
    <text x="265" y="44" fill="#cdd6f4" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">má (35)</text>
    <text x="265" y="65" fill="#bac2de" font-size="12" text-anchor="middle" font-family="'Noto Sans Myanmar', sans-serif">အမေးတက်သံ (မာ?)</text>

    <!-- Card 3 -->
    <rect x="355" y="0" width="140" height="85" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="425" y="24" fill="#89b4fa" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Noto Sans Myanmar', sans-serif">၃ သံ (တတိယသံ)</text>
    <text x="425" y="44" fill="#cdd6f4" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">mǎ (214)</text>
    <text x="425" y="65" fill="#bac2de" font-size="12" text-anchor="middle" font-family="'Noto Sans Myanmar', sans-serif">နိမ့်ဆင်းတက် (မာ့~ဟား)</text>

    <!-- Card 4 -->
    <rect x="515" y="0" width="140" height="85" rx="8" fill="#313244" stroke="#fab387" stroke-width="1.5"/>
    <text x="585" y="24" fill="#fab387" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Noto Sans Myanmar', sans-serif">၄ သံ (စတုတ္ထသံ)</text>
    <text x="585" y="44" fill="#cdd6f4" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">mà (51)</text>
    <text x="585" y="65" fill="#bac2de" font-size="12" text-anchor="middle" font-family="'Noto Sans Myanmar', sans-serif">တိုပြတ်ဖိသံ (မတ်!)</text>
  </g>
</svg>
