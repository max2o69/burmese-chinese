<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="operaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="duckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="900" height="480" fill="url(#bgGrad)" rx="16" />

  <!-- Outer Header -->
  <text x="450" y="42" font-family="'Noto Sans SC', sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    第十六课：你看过京剧吗？ • 北京文化与生活体验
  </text>
  <text x="450" y="66" font-family="'Noto Sans Myanmar', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    သင်ခန်းစာ (၁၆) - ပေကျင်းဇာတ်သဘင် (京剧) နှင့် ပေကျင်းဘဲကင် (烤鸭) ယဉ်ကျေးမှု အတွေ့အကြုံများ
  </text>

  <!-- Left Card: Beijing Opera (京剧) -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect width="390" height="340" rx="16" fill="url(#cardGrad)" stroke="#ef4444" stroke-opacity="0.4" stroke-width="2" />
    
    <!-- Top badge -->
    <rect x="20" y="20" width="130" height="30" rx="15" fill="url(#operaGrad)" />
    <text x="85" y="40" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      京剧 (Beijing Opera)
    </text>

    <!-- Opera Mask Illustration Graphic -->
    <g transform="translate(195, 125)">
      <!-- Head Contour -->
      <ellipse cx="0" cy="0" rx="55" ry="70" fill="#f8fafc" stroke="#dc2626" stroke-width="3" />
      
      <!-- Crown / Headdress -->
      <path d="M-60 -45 Q0 -85 60 -45 L50 -25 Q0 -55 -50 -25 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
      <circle cx="-35" cy="-55" r="7" fill="#ef4444" />
      <circle cx="0" cy="-68" r="9" fill="#dc2626" />
      <circle cx="35" cy="-55" r="7" fill="#ef4444" />
      <!-- Tassels -->
      <line x1="-55" y1="-30" x2="-65" y2="20" stroke="#f59e0b" stroke-width="3" />
      <line x1="55" y1="-30" x2="65" y2="20" stroke="#f59e0b" stroke-width="3" />

      <!-- Painted Facial Mask Patterns (Lianpu) -->
      <!-- Red Courage & Loyalty patches -->
      <path d="M-40 -20 Q0 -35 40 -20 Q30 20 0 45 Q-30 20 -40 -20 Z" fill="#ef4444" opacity="0.85" />
      <!-- Eyes & Brow marks -->
      <ellipse cx="-22" cy="-5" rx="12" ry="7" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
      <circle cx="-20" cy="-5" r="4" fill="#0f172a" />
      <ellipse cx="22" cy="-5" rx="12" ry="7" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
      <circle cx="20" cy="-5" r="4" fill="#0f172a" />

      <path d="M-36 -18 Q-22 -30 -10 -18" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
      <path d="M36 -18 Q22 -30 10 -18" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />

      <!-- Nose & Mouth -->
      <path d="M-6 8 Q0 16 6 8" fill="none" stroke="#0f172a" stroke-width="2" />
      <path d="M-15 28 Q0 40 15 28 Q0 32 -15 28 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="1.5" />

      <!-- Beard (Ran Kou) -->
      <path d="M-30 45 C -25 90, 25 90, 30 45 C 15 75, -15 75, -30 45 Z" fill="#0f172a" />
    </g>

    <!-- Opera Details / Text -->
    <text x="195" y="240" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="bold" fill="#fca5a5" text-anchor="middle">
      你看过京剧吗？ • 人民剧场
    </text>
    <text x="195" y="262" font-family="'Noto Sans Myanmar', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">
      ပေကျင်းဇာတ် ကြည့်ဖူးသလား • ပြည်သူ့ဇာတ်ရုံတွင် အမြဲကပြသည်
    </text>

    <!-- Roles Tags -->
    <g transform="translate(30, 285)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="#334155" />
      <text x="35" y="17" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">生 (Shēng)</text>

      <rect x="85" y="0" width="70" height="26" rx="6" fill="#334155" />
      <text x="120" y="17" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">旦 (Dàn)</text>

      <rect x="170" y="0" width="75" height="26" rx="6" fill="#334155" />
      <text x="207" y="17" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">净 (Jìng)</text>

      <rect x="260" y="0" width="70" height="26" rx="6" fill="#334155" />
      <text x="295" y="17" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">丑 (Chǒu)</text>
    </g>
  </g>

  <!-- Right Card: Beijing Roast Duck (北京烤鸭) -->
  <g transform="translate(470, 90)" filter="url(#shadow)">
    <rect width="390" height="340" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2" />
    
    <!-- Top badge -->
    <rect x="20" y="20" width="145" height="30" rx="15" fill="url(#duckGrad)" />
    <text x="92" y="40" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      北京烤鸭 (Roast Duck)
    </text>

    <!-- Roast Duck Platter Illustration -->
    <g transform="translate(195, 125)">
      <!-- Serving Plate (Large Oval) -->
      <ellipse cx="0" cy="0" rx="100" ry="50" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="88" ry="42" fill="#f1f5f9" />

      <!-- Golden Crispy Duck Slices -->
      <g fill="#b45309" stroke="#78350f" stroke-width="1.5">
        <path d="M-60 -10 Q-30 -30 0 -10 Q-30 5 -60 -10 Z" fill="#d97706" />
        <path d="M-40 -5 Q-10 -25 20 -5 Q-10 10 -40 -5 Z" fill="#b45309" />
        <path d="M-20 0 Q10 -20 40 0 Q10 15 -20 0 Z" fill="#d97706" />
        <path d="M0 5 Q30 -15 60 5 Q30 20 0 5 Z" fill="#92400e" />
        <path d="M-30 8 Q0 -10 30 8 Q0 22 -30 8 Z" fill="#b45309" />
      </g>

      <!-- Sauce Bowl (Sweet Bean Sauce - 甜面酱) -->
      <ellipse cx="65" cy="-20" rx="22" ry="14" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
      <ellipse cx="65" cy="-20" rx="17" ry="10" fill="#451a03" />

      <!-- Spring Onion / Cucumber shreds -->
      <g stroke="#15803d" stroke-width="2" stroke-linecap="round">
        <line x1="-70" y1="15" x2="-45" y2="20" />
        <line x1="-65" y1="10" x2="-40" y2="25" />
        <line x1="-55" y1="12" x2="-35" y2="18" />
      </g>

      <!-- Steamed Pancakes (荷叶饼) -->
      <ellipse cx="-60" cy="-20" rx="26" ry="15" fill="#fef08a" opacity="0.9" stroke="#fde047" stroke-width="1" />
      <ellipse cx="-63" cy="-23" rx="26" ry="15" fill="#fef9c3" opacity="0.9" stroke="#fde047" stroke-width="1" />
    </g>

    <!-- Duck Details / Text -->
    <text x="195" y="240" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="bold" fill="#fcd34d" text-anchor="middle">
      烤鸭是北京的名菜 • 应该去尝一尝
    </text>
    <text x="195" y="262" font-family="'Noto Sans Myanmar', sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">
      ဘဲကင်သည် ပေကျင်း၏ နာမည်ကြီးဟင်းလျာဖြစ်သည် • သွားမြည်းစမ်းသင့်သည်
    </text>

    <!-- Features Tags -->
    <g transform="translate(25, 285)">
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#334155" />
      <text x="52" y="17" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#fde68a" text-anchor="middle">北京名菜 (Famous)</text>

      <rect x="115" y="0" width="105" height="26" rx="6" fill="#334155" />
      <text x="167" y="17" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">尝一尝 (Taste a bit)</text>

      <rect x="230" y="0" width="110" height="26" rx="6" fill="#334155" />
      <text x="285" y="17" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">还没吃过 (Not eaten yet)</text>
    </g>
  </g>

  <!-- Bottom Global Footer Note -->
  <rect x="120" y="445" width="660" height="25" rx="6" fill="#1e293b" opacity="0.8" />
  <text x="450" y="462" font-family="'Noto Sans Myanmar', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    💡 စကားပြောအသုံး: အတွေ့အကြုံရှိဖူးခြင်းကို "看过 / 吃过" ဖြင့် ဖော်ပြပြီး မကြုံဖူးသေးပါက "没看过 / 还没吃过呢" ဟု ငြင်းပယ်သုံးစွဲသည်။
  </text>
</svg>
