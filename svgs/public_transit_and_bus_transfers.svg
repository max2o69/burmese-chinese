<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradL13_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e38"/>
    </linearGradient>
    <linearGradient id="cardGradL13_1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowL13_1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="640" rx="18" fill="url(#bgGradL13_1)" stroke="#334155" stroke-width="2"/>

  <!-- Header Section -->
  <g transform="translate(40, 24)">
    <text x="400" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">
      ဘတ်စ်ကားစီးခြင်းနှင့် ကားပြောင်းစီးခြင်း လမ်းညွှန် (Public Transit &amp; Bus Transfers)
    </text>
    <text x="400" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
      ကားလိုင်း (路) • မှတ်တိုင် (站) • ကားပြောင်းစီးခြင်း (换车) • နံပါတ် "1" ကို "yāo" ဟု ဖတ်ကြားပုံ
    </text>
  </g>

  <!-- Left Column: Core Bus Terms & Number 1 Pronunciation -->
  <g transform="translate(40, 85)">
    <rect width="385" height="525" rx="14" fill="url(#cardGradL13_1)" stroke="#0ea5e9" stroke-width="1.2" filter="url(#shadowL13_1)"/>
    
    <text x="20" y="30" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">
      🚌 ၁။ ဘတ်စ်ကားဆိုင်ရာ အခြေခံဝေါဟာရများ
    </text>

    <!-- Bus Vocabulary Cards Grid -->
    <g transform="translate(20, 48)">
      <!-- Card 1: 路 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="64" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="12" y="22" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">路 (Lù)</text>
        <text x="12" y="40" fill="#f8fafc" font-family="sans-serif" font-size="11">လိုင်းကား / ကားလိုင်း</text>
        <text x="12" y="56" fill="#94a3b8" font-family="sans-serif" font-size="10">ဥပမာ: 331路 / 375路</text>
      </g>
      <!-- Card 2: 站 -->
      <g transform="translate(180, 0)">
        <rect width="165" height="64" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="12" y="22" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">站 (Zhàn)</text>
        <text x="12" y="40" fill="#f8fafc" font-family="sans-serif" font-size="11">မှတ်တိုင် / ဘူတာ</text>
        <text x="12" y="56" fill="#94a3b8" font-family="sans-serif" font-size="10">ဥပမာ: 还有几站 (ဘယ်နှစ်မှတ်တိုင်)</text>
      </g>
      <!-- Card 3: 上车 / 下车 -->
      <g transform="translate(0, 74)">
        <rect width="165" height="64" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="12" y="22" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">上车 / 下车</text>
        <text x="12" y="40" fill="#f8fafc" font-family="sans-serif" font-size="11">ကားတက် / ကားဆင်း</text>
        <text x="12" y="56" fill="#94a3b8" font-family="sans-serif" font-size="10">Shàng chē / Xià chē</text>
      </g>
      <!-- Card 4: 换车 -->
      <g transform="translate(180, 74)">
        <rect width="165" height="64" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="12" y="22" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold">换车 (Huàn chē)</text>
        <text x="12" y="40" fill="#f8fafc" font-family="sans-serif" font-size="11">ကားပြောင်းစီးသည်</text>
        <text x="12" y="56" fill="#94a3b8" font-family="sans-serif" font-size="10">Transfer buses</text>
      </g>
    </g>

    <!-- Special Number 1 Pronunciation Rule -->
    <g transform="translate(20, 205)">
      <rect width="345" height="150" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <text x="15" y="24" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold">
        🔢 အထူးအသံထွက် စည်းမျဉ်း: နံပါတ် "1" ကို "yāo" ဟု ဖတ်ခြင်း
      </text>
      <text x="15" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="11">
        တရုတ်နိုင်ငံတွင် ကားလိုင်းနံပါတ်၊ ဖုန်းနံပါတ်၊ အခန်းနံပါတ်များတွင် "1" (yī) ကို
      </text>
      <text x="15" y="64" fill="#cbd5e1" font-family="sans-serif" font-size="11">
        "7" (qī) နှင့် အသံမမှားစေရန်အတွက် <tspan fill="#34d399" font-weight="bold">yāo (幺)</tspan> ဟု အသံထွက်လေ့ရှိသည်:
      </text>

      <g transform="translate(15, 78)">
        <rect width="315" height="55" rx="6" fill="#1e293b"/>
        <text x="157" y="24" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
          331 路 ➔ <tspan fill="#fbbf24">三三一路 (sān-sān-yāo lù)</tspan>
        </text>
        <text x="157" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">
          (လိုင်းကားနံပါတ် ၃၃၁ - ဆန်း ဆန်း ယောင်း လု)
        </text>
      </g>
    </g>

    <!-- Measure word 张 -->
    <g transform="translate(20, 375)">
      <rect width="345" height="125" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="15" y="22" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">
        🎫 လက်မှတ်ရေတွက်ပြပုဒ် "张" (Zhāng):
      </text>
      <text x="15" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="11">
        စက္ကူပြား၊ လက်မှတ်၊ မြေပုံ၊ စားပွဲ ကဲ့သို့ ပြားချပ်သောအရာများတွင် "张" ကို သုံးသည်:
      </text>
      <text x="15" y="68" fill="#34d399" font-family="sans-serif" font-size="11">• 两张票 (Liǎng zhāng piào) - လက်မှတ် ၂ စောင်</text>
      <text x="15" y="88" fill="#34d399" font-family="sans-serif" font-size="11">• 一张地图 (Yì zhāng dìtú) - မြေပုံ ၁ ချပ်</text>
      <text x="15" y="108" fill="#94a3b8" font-family="sans-serif" font-size="10">
        မေးခွန်း: 多少钱一张？ (တစ်စောင် ဘယ်လောက်လဲ)
      </text>
    </g>
  </g>

  <!-- Right Column: Bus Inquiries & Dialog Flow -->
  <g transform="translate(455, 85)">
    <rect width="385" height="525" rx="14" fill="url(#cardGradL13_1)" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadowL13_1)"/>
    
    <text x="20" y="30" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">
      🗺️ ၂။ ကားစီးစဉ် အမေးအဖြေ စကားပြော အဆင့်ဆင့်
    </text>

    <!-- Dialog steps -->
    <g transform="translate(20, 48)">
      <!-- Step 1: Inquiring destination -->
      <g transform="translate(0, 0)">
        <rect width="345" height="88" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="12" y="20" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">အဆင့် ၁: လိုင်းကား ရောက်/မရောက် မေးမြန်းခြင်း</text>
        <text x="12" y="38" fill="#f8fafc" font-family="sans-serif" font-size="12">这路车到天安门吗？</text>
        <text x="12" y="54" fill="#94a3b8" font-family="sans-serif" font-size="10">Zhè lù chē dào Tiān'ānmén ma? (ဒီကား ထျန်းအန်းမင် ရောက်သလား)</text>
        <text x="12" y="74" fill="#34d399" font-family="sans-serif" font-size="11">➔ 到。上车吧。 (ရောက်တယ်၊ ကားပေါ်တက်ပါ)</text>
      </g>

      <!-- Step 2: Buying tickets & change -->
      <g transform="translate(0, 98)">
        <rect width="345" height="98" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="12" y="20" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">အဆင့် ၂: လက်မှတ်ဝယ်ယူခြင်းနှင့် ငွေအမ်းခြင်း</text>
        <text x="12" y="38" fill="#f8fafc" font-family="sans-serif" font-size="12">买两张票。多少钱一张？ ➔ 两块。</text>
        <text x="12" y="56" fill="#38bdf8" font-family="sans-serif" font-size="11">给你五块钱。 <tspan fill="#94a3b8">(ဒီမှာ ၅ ယွမ်ပါ)</tspan></text>
        <text x="12" y="76" fill="#34d399" font-family="sans-serif" font-size="11">找你一块。 <tspan fill="#94a3b8">(၁ ယွမ် ပြန်အမ်းပါတယ် - 双宾句)</tspan></text>
      </g>

      <!-- Step 3: Stops inquiry -->
      <g transform="translate(0, 206)">
        <rect width="345" height="88" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="12" y="20" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">အဆင့် ၃: ကျန်ရှိသော မှတ်တိုင် အရေအတွက် စုံစမ်းခြင်း</text>
        <text x="12" y="38" fill="#f8fafc" font-family="sans-serif" font-size="12">到天安门还有几站？</text>
        <text x="12" y="54" fill="#94a3b8" font-family="sans-serif" font-size="10">Dào Tiān'ānmén hái yǒu jǐ zhàn? (ထျန်းအန်းမင်ရောက်ဖို့ ဘယ်နှစ်မှတ်တိုင် ကျန်လဲ)</text>
        <text x="12" y="74" fill="#34d399" font-family="sans-serif" font-size="11">➔ 三站。 (၃ မှတ်တိုင် ကျန်ပါသေးတယ်)</text>
      </g>

      <!-- Step 4: Bus Transfer -->
      <g transform="translate(0, 304)">
        <rect width="345" height="145" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
        <text x="12" y="20" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">အဆင့် ၄: ကားပြောင်းစီးရန် လမ်းညွှန်တောင်းခံခြင်း</text>
        <text x="12" y="38" fill="#f8fafc" font-family="sans-serif" font-size="11">• 去语言大学要换车吗？ ➔ 要换车。</text>
        <text x="12" y="56" fill="#94a3b8" font-family="sans-serif" font-size="10">(ကားပြောင်းစီးရမလား ➔ ပြောင်းစီးရပါမယ်)</text>
        <text x="12" y="76" fill="#f8fafc" font-family="sans-serif" font-size="11">• 在哪儿换车？ ➔ 北京师范大学。</text>
        <text x="12" y="94" fill="#94a3b8" font-family="sans-serif" font-size="10">(ဘယ်မှာ ပြောင်းစီးရမလဲ ➔ ပေကျင်းဆရာအတတ်သင်တက္ကသိုလ်မှာ)</text>
        <text x="12" y="114" fill="#f8fafc" font-family="sans-serif" font-size="11">• 换几路车？ ➔ 换331路。</text>
        <text x="12" y="132" fill="#94a3b8" font-family="sans-serif" font-size="10">(ဘယ်လိုင်းကား ပြောင်းစီးရမလဲ ➔ ၃၃၁ လိုင်းကား ပြောင်းစီးပါ)</text>
      </g>
    </g>
  </g>
</svg>
