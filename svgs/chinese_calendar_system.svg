<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradL6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowL6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="540" rx="16" fill="url(#bgGradL6)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <g transform="translate(40, 24)">
    <text x="380" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">
      တရုတ်ပြက္ခဒိန်နှင့် ရက်စွဲဖော်ပြနည်းစနစ် (Chinese Calendar &amp; Date System)
    </text>
    <text x="380" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
      အကြီးဆုံးမှ အသေးဆုံးသို့ (နှစ် ➔ လ ➔ ရက် ➔ နေ့) နှင့် နာမ်ကြိယာမဲ့ဝါကျ စည်းမျဉ်း
    </text>
  </g>

  <!-- Main Hierarchy Hierarchy Boxes -->
  <g transform="translate(40, 85)">
    <!-- 4 Hierarchy Step Blocks -->
    <g transform="translate(0, 0)">
      <!-- Box 1: Year -->
      <g transform="translate(0, 0)">
        <rect width="175" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowL6)"/>
        <text x="87" y="32" fill="#38bdf8" font-family="'Noto Sans SC', sans-serif" font-size="22" font-weight="bold" text-anchor="middle">年 (nián)</text>
        <text x="87" y="55" fill="#facc15" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">၁။ နှစ် (Year)</text>
        <text x="87" y="74" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">二〇二六年</text>
      </g>
      
      <!-- Arrow 1 -->
      <text x="187" y="52" fill="#64748b" font-family="sans-serif" font-size="20" font-weight="bold">➔</text>

      <!-- Box 2: Month -->
      <g transform="translate(205, 0)">
        <rect width="175" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowL6)"/>
        <text x="87" y="32" fill="#38bdf8" font-family="'Noto Sans SC', sans-serif" font-size="22" font-weight="bold" text-anchor="middle">月 (yuè)</text>
        <text x="87" y="55" fill="#facc15" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">၂။ လ (Month)</text>
        <text x="87" y="74" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">十月 (၁၀ လ)</text>
      </g>

      <!-- Arrow 2 -->
      <text x="392" y="52" fill="#64748b" font-family="sans-serif" font-size="20" font-weight="bold">➔</text>

      <!-- Box 3: Day -->
      <g transform="translate(410, 0)">
        <rect width="175" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowL6)"/>
        <text x="87" y="32" fill="#38bdf8" font-family="'Noto Sans SC', sans-serif" font-size="22" font-weight="bold" text-anchor="middle">号 / 日 (hào/rì)</text>
        <text x="87" y="55" fill="#facc15" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">၃။ ရက်စွဲ (Day)</text>
        <text x="87" y="74" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">八号 (၈ ရက်)</text>
      </g>

      <!-- Arrow 3 -->
      <text x="597" y="52" fill="#64748b" font-family="sans-serif" font-size="20" font-weight="bold">➔</text>

      <!-- Box 4: Weekday -->
      <g transform="translate(615, 0)">
        <rect width="145" height="90" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadowL6)"/>
        <text x="72" y="32" fill="#34d399" font-family="'Noto Sans SC', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">星期 (xīngqī)</text>
        <text x="72" y="55" fill="#facc15" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">၄။ နေ့ (Weekday)</text>
        <text x="72" y="74" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">星期天 (တနင်္ဂနွေ)</text>
      </g>
    </g>

    <!-- Weekday Table (7 Days) -->
    <g transform="translate(0, 110)">
      <rect width="760" height="150" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="25" y="28" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">
        🗓️ တစ်ပတ်၏ ၇ ရက် ဖော်ပြပုံ (Weekdays System)
      </text>

      <g transform="translate(20, 42)">
        <!-- 7 Days Grid -->
        <g transform="translate(0, 0)">
          <rect width="95" height="85" rx="8" fill="#1e293b" stroke="#475569"/>
          <text x="47" y="28" fill="#cbd5e1" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">星期一</text>
          <text x="47" y="48" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">တနင်္လာ</text>
          <text x="47" y="68" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">xīngqīyī</text>
        </g>

        <g transform="translate(103, 0)">
          <rect width="95" height="85" rx="8" fill="#1e293b" stroke="#475569"/>
          <text x="47" y="28" fill="#cbd5e1" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">星期二</text>
          <text x="47" y="48" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">အင်္ဂါ</text>
          <text x="47" y="68" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">xīngqī'èr</text>
        </g>

        <g transform="translate(206, 0)">
          <rect width="95" height="85" rx="8" fill="#1e293b" stroke="#475569"/>
          <text x="47" y="28" fill="#cbd5e1" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">星期三</text>
          <text x="47" y="48" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">ဗုဒ္ဓဟူး</text>
          <text x="47" y="68" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">xīngqīsān</text>
        </g>

        <g transform="translate(309, 0)">
          <rect width="95" height="85" rx="8" fill="#1e293b" stroke="#475569"/>
          <text x="47" y="28" fill="#cbd5e1" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">星期四</text>
          <text x="47" y="48" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">ကြာသပတေး</text>
          <text x="47" y="68" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">xīngqīsì</text>
        </g>

        <g transform="translate(412, 0)">
          <rect width="95" height="85" rx="8" fill="#1e293b" stroke="#475569"/>
          <text x="47" y="28" fill="#cbd5e1" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">星期五</text>
          <text x="47" y="48" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">သောကြာ</text>
          <text x="47" y="68" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">xīngqīwǔ</text>
        </g>

        <g transform="translate(515, 0)">
          <rect width="95" height="85" rx="8" fill="#1e293b" stroke="#475569"/>
          <text x="47" y="28" fill="#cbd5e1" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">星期六</text>
          <text x="47" y="48" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">စနေ</text>
          <text x="47" y="68" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">xīngqīliù</text>
        </g>

        <!-- Sunday special highlight -->
        <g transform="translate(618, 0)">
          <rect width="102" height="85" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
          <text x="51" y="28" fill="#fca5a5" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">星期天 / 日</text>
          <text x="51" y="48" fill="#facc15" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">တနင်္ဂနွေ</text>
          <text x="51" y="68" fill="#fca5a5" font-family="sans-serif" font-size="9" text-anchor="middle">(❌ 星期七 မဟုတ်)</text>
        </g>
      </g>
    </g>

    <!-- Nominal Predicate Sentence Rule -->
    <g transform="translate(0, 280)">
      <rect width="760" height="135" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="25" y="28" fill="#a78bfa" font-family="sans-serif" font-size="15" font-weight="bold">
        ⚡ နာမ်ကြိယာမဲ့ဝါကျ စည်းမျဉ်း (Nominal Predicate): “是” ထည့်စရာမလိုပါ!
      </text>

      <g transform="translate(25, 42)" font-family="sans-serif">
        <text x="0" y="20" fill="#f8fafc" font-size="14" font-weight="bold">
          • အတည်ဝါကျ: <tspan fill="#34d399">今天八号。</tspan> (ဒီနေ့ ၈ ရက်နေ့) / <tspan fill="#34d399">今天星期天。</tspan> (ဒီနေ့ တနင်္ဂနွေနေ့)
        </text>
        <text x="15" y="40" fill="#94a3b8" font-size="12">
          ရက်စွဲ၊ နေ့ရက်၊ အသက်တို့ကို ဖော်ပြရာတွင် “是” ထည့်စရာမလိုဘဲ နာမ်က တိုက်ရိုက် မဏ္ဍိုင်ပြုနိုင်ပါသည်
        </text>

        <text x="0" y="68" fill="#f8fafc" font-size="14" font-weight="bold">
          • အငြင်းဝါကျ: <tspan fill="#ef4444">今天不是星期四，昨天星期四。</tspan>
        </text>
        <text x="15" y="88" fill="#cbd5e1" font-size="12">
          အငြင်းပြုလုပ်လိုပါက “不是 (bú shì)” ကို မဖြစ်မနေ ထည့်သွင်းရပါသည်
        </text>
      </g>
    </g>
  </g>
</svg>
